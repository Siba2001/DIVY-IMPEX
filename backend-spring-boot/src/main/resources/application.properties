# ===================================================================
# DIVY IMPEX - Spring Boot Application Configuration
# ===================================================================

server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection (WampServer / Local MySQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/divy_impex_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# DIVY IMPEX Security Token (matches Code.gs API_SECRET)
# -------------------------------------------------------------------
divy.api.secret=DIVY_SECURE_TOKEN_2026

